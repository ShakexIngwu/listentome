# Alembic configuration file
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts (relative to this file)
script_location = db/migrations

# Template used to generate new migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path addition for env.py imports
prepend_sys_path = .

# Timezone for revision timestamps
timezone = UTC

# SQLAlchemy URL is read dynamically from settings in db/migrations/env.py
# (POSTGRES_URL env var → config.py → env.py)

[post_write_hooks]
# No post-write hooks configured

# ── Logging ───────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
